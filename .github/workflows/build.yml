name: Windows-Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Kurzer Start-Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import yokai.app, yokai.run, yokai.bosses; print('Import OK')"

      - name: Tests (Daten, Menüs, ein Bot-Lauf)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONIOENCODING: utf-8
        working-directory: tools
        run: |
          python validate.py
          python uiflow2.py
          python bot.py 1

      - name: Version lesen
        id: ver
        shell: bash
        run: echo "v=$(python -c 'from yokai.settings import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Build-Nummer ins Spiel schreiben
        shell: bash
        run: echo "${{ github.run_number }}" > yokai/assets/build.txt

      - name: EXE bauen
        run: pyinstaller --noconfirm --onefile --windowed --name YokaiNoMichi --icon icon.png --collect-data pygame --add-data "yokai/assets;yokai/assets" main.py

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: YokaiNoMichi-Windows
          path: dist/YokaiNoMichi.exe

      - name: Release-Text erzeugen
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/release_notes.py

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build${{ github.run_number }}
          name: Yōkai no Michi ${{ steps.ver.outputs.v }} – Build ${{ github.run_number }}
          files: dist/YokaiNoMichi.exe
          body_path: release_notes.md
